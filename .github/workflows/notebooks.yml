name: Execute all notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part:
          - part-1-linear-algebra
          - part-2-calculus-and-optimization
          - part-3-probability
          - part-4-statistics
          - part-5-learning-theory
          - part-6-deep-learning-and-modern-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute and verify notebooks (${{ matrix.part }})
        run: python tools/run_notebooks.py --no-write ${{ matrix.part }}
